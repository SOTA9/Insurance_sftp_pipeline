[pytest]
# InsureFlow DataPipeline — pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:cacheprovider

# Custom markers
markers =
    unit: Pure unit tests (no network, no filesystem side effects)
    integration: Tests requiring real GCS / SFTP connections (skipped in CI)
    slow: Tests that take > 5s (e.g. PGP key generation)

# Log level during tests
log_cli = true
log_cli_level = WARNING
log_level = DEBUG

# Coverage (also configured via CLI flags in .gitlab-ci.yml)
# Run locally with: pytest --cov=pipeline --cov=schemas --cov-report=term-missing